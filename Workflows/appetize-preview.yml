name: Build and Stream on Appetize

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload to Appetize.io
        id: appetize
        uses: appetizeio/appetize-github-action@v1
        with:
          api-token: ${{ secrets.APPETIZE_API_TOKEN }}
          file-path: app/build/outputs/apk/debug/app-debug.apk
          platform: android

      - name: Comment Preview Link on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const appUrl = '${{ steps.appetize.outputs.app-url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 📱 In-Browser Android Preview Ready!\n\nRun and test your build directly in the browser: [Launch App on Appetize](${appUrl})`
            });
