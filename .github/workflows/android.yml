name: Android CI & Appetize Preview

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Locate APK File
        run: |
          echo "Locating built APK..."
          find . -name "*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload to Appetize.io
        id: appetize
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          if [ -z "$APPETIZE_TOKEN" ]; then
            echo "ℹ️ APPETIZE_API_TOKEN secret is not set. Skipping Appetize upload."
            exit 0
          fi

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Searching for built APK..."
            FOUND_APK=$(find . -name "*.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              APK_PATH="$FOUND_APK"
              echo "Found APK at $APK_PATH"
            else
              echo "🚨 Error: No APK file found in build outputs!"
              exit 1
            fi
          fi

          echo "Requesting direct upload URL from Appetize.io v2 API..."
          RESPONSE=$(curl -s -X POST "https://api.appetize.io/v2/apps/direct-upload-url" \
            -H "Authorization: Bearer $APPETIZE_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}')

          UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.uploadUrl // empty')
          PUBLIC_KEY=$(echo "$RESPONSE" | jq -r '.publicKey // empty')

          if [ -n "$UPLOAD_URL" ] && [ "$UPLOAD_URL" != "null" ]; then
            echo "Uploading $APK_PATH via Appetize v2..."
            curl -s -X PUT -T "$APK_PATH" "$UPLOAD_URL"
            APP_URL="https://appetize.io/app/$PUBLIC_KEY"
          else
            echo "v2 API Response: $RESPONSE"
            echo "Attempting Appetize v1 endpoint fallback..."
            V1_RESPONSE=$(curl -s -u "$APPETIZE_TOKEN:" -F "file=@$APK_PATH" -F "platform=android" https://api.appetize.io/v1/apps)
            PUBLIC_KEY=$(echo "$V1_RESPONSE" | jq -r '.publickey // .publicKey // empty')
            if [ -n "$PUBLIC_KEY" ] && [ "$PUBLIC_KEY" != "null" ]; then
              APP_URL="https://appetize.io/app/$PUBLIC_KEY"
            else
              echo "v1 API Response: $V1_RESPONSE"
              echo "🚨 ERROR: Appetize API upload failed. Please verify your APPETIZE_API_TOKEN in GitHub Repository Settings -> Secrets."
              exit 1
            fi
          fi

          echo "app-url=$APP_URL" >> $GITHUB_OUTPUT
          echo "🎉 Appetize Preview URL: $APP_URL"

      - name: Post Preview Link to PR Comment
        if: github.event_name == 'pull_request' && steps.appetize.outputs.app-url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const appUrl = '${{ steps.appetize.outputs.app-url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 📱 In-Browser Android Preview Ready!\n\nClick to launch and test this build in your browser:\n[**Launch Precord on Appetize.io**](${appUrl})`
            });
