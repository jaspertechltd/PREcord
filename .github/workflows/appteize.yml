name: Appetize In-Browser Stream

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5 # Upgraded to v5 to resolve the Node 20 deprecation warning!

      - name: Set up JDK 17
        uses: actions/setup-java@v5 # Upgraded to v5 to keep the CI/CD pipeline cutting-edge!
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Executable Permissions to Gradle
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Locate the APK (Diagnostic Analyzer)
        run: |
          echo "Scanning the repository array, looking for where the APKs play..."
          find . -name "*.apk"
          echo "If the path below doesn't match the path found above, the upload will fail!"

      - name: Upload to Appetize.io via REST API
        id: appetize
        run: |
          # ⚠️ CRITICAL: If the diagnostic step above shows a different path, update this variable!
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "🚨 ERROR: APK not found at $APK_PATH. The drop has failed!"
            exit 1
          fi

          RESPONSE=$(curl --silent --show-error --location \
            --request POST 'https://api.appetize.io/v2/apps' \
            --header "Authorization: Bearer ${{ secrets.APPETIZE_API_TOKEN }}" \
            --form "file=@$APK_PATH" \
            --form "platform=android")

          echo "API Response: $RESPONSE"
          APP_URL=$(echo "$RESPONSE" | jq -r '.appURL')

          if [ "$APP_URL" == "null" ] || [ -z "$APP_URL" ]; then
            echo "🚨 ERROR: Appetize API upload failed! Check your API token."
            exit 1
          fi

          echo "app-url=$APP_URL" >> $GITHUB_OUTPUT

      - name: Post Link to PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const appUrl = '${{ steps.appetize.outputs.app-url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 📱 In-Browser Android Preview Ready!\n\nClick to launch and interact with this build:\n[**Launch on Appetize.io**](${appUrl})`
            });
