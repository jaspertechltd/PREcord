name: Appetize In-Browser Stream

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Executable Permissions to Gradle
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload to Appetize
        id: appetize
        uses: appetizeio/appetize-github-action@v1
        with:
          api-token: ${{ secrets.APPETIZE_API_TOKEN }}
          file-path: app/build/outputs/apk/debug/app-debug.apk
          platform: android

      - name: Output Stream URL
        run: |
          echo "Stream your build in-browser at: ${{ steps.appetize.outputs.app-url }}"

      - name: Post Link to PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 📱 In-Browser Android Preview Ready!\n\nClick to launch and interact with this build:\n[**Launch on Appetize.io**](${{ steps.appetize.outputs.app-url }})`
            });
